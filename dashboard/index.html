<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>analytics.log — Tejas Darunte</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <div class="terminal">

    <!-- ── Header bar ───────────────────────────────────────────── -->
    <div class="term-header">
      <div class="term-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="term-title">tejas@portfolio — analytics.log</div>
      <div class="term-controls">
        <select id="limit-select" class="term-select" onchange="loadData()">
          <option value="100">last 100</option>
          <option value="200" selected>last 200</option>
          <option value="500">last 500</option>
        </select>
        <label class="term-check">
          <input type="checkbox" id="auto-cb" onchange="toggleAuto()" /> auto:30s
        </label>
        <button id="refresh-btn" class="term-btn" onclick="loadData()">↻ refresh</button>
      </div>
    </div>

    <!-- ── Status line ──────────────────────────────────────────── -->
    <div class="term-status">
      <span class="status-prompt">$</span>
      <span id="status-text" class="status-idle">idle — press refresh to load</span>
      <span id="last-updated" class="status-ts"></span>
    </div>

    <!-- ── Stat bar ─────────────────────────────────────────────── -->
    <div id="stat-bar" class="stat-bar" style="display:none">
      <span class="stat-item"><span class="stat-k">VISITS</span><span class="stat-v" id="s-visits">0</span></span>
      <span class="stat-sep">│</span>
      <span class="stat-item"><span class="stat-k">UNIQUE</span><span class="stat-v" id="s-unique">0</span></span>
      <span class="stat-sep">│</span>
      <span class="stat-item"><span class="stat-k">LIKES</span><span class="stat-v liked" id="s-likes">0</span></span>
      <span class="stat-sep">│</span>
      <span class="stat-item"><span class="stat-k">SECTIONS</span><span class="stat-v" id="s-sections">0</span></span>
      <span class="stat-sep">│</span>
      <span class="stat-item"><span class="stat-k">TODAY↑</span><span class="stat-v green" id="s-today">0v / 0l</span></span>
      <span class="stat-sep">│</span>
      <span class="stat-item"><span class="stat-k">RATE</span><span class="stat-v" id="s-rate">0.0%</span></span>
    </div>

    <!-- ── Top sections bar ─────────────────────────────────────── -->
    <div id="sections-bar" class="sections-bar" style="display:none">
      <span class="stat-k">TOP SECTIONS → </span>
      <span id="top-sections-list"></span>
    </div>

    <!-- ── Loading / Error ─────────────────────────────────────── -->
    <div id="state-loading" class="state-line" style="display:none">
      <span class="blink">▮</span> <span class="dim">connecting to render... (cold start may take 30–60s)</span>
    </div>
    <div id="state-error" class="state-line err" style="display:none">
      <span class="err-icon">✗</span> <span id="err-msg"></span>
      <button class="term-btn-inline" onclick="loadData()">retry</button>
    </div>

    <!-- ── Log feed ─────────────────────────────────────────────── -->
    <div class="log-header">
      <span class="dim">timestamp (UTC)      </span>
      <span class="dim">type     </span>
      <span class="dim">hash         </span>
      <span class="dim">details</span>
    </div>
    <div id="log-feed" class="log-feed"></div>

  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
